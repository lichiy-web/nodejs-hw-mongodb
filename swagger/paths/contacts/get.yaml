tags:
  - Contacts
summary: Get a list of the user's contacts
operationId: getAllContacts
description:
  'Get **an array** of objects representing **the contacts** created by the
  user. </br> Use **filters** as query parameters to narrow down the server
  response. </br> **Sort** response by the specific parameter in ascending or
  descending order. </br> Use **pagination** by passing the page number and
  number of contacts per page in the query parameters.'
security:
  - bearerAuth: []
parameters:
  - $ref: ../../components/schemas/authHeader.yaml
  - in: query
    name: page
    schema:
      type: integer
      example: 14
      default: 1
  - in: query
    name: perPage
    schema:
      type: integer
      example: 20
      default: 10
  - in: query
    name: sortBy
    schema:
      type: string
      example: 'name'
      default: '_id'
    description: "All contacts's fields can be mentioned."
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'
      default: 'asc'
  - in: query
    name: type
    schema:
      description:
        The filter parameter that narrows down the response by the contact type.
      type: string
      enum: ['work', 'home', 'personal']
      example: home
      default: null
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: true
      default: null
  - $ref: ../../components/schemas/cookieSessionId.yaml
  - $ref: ../../components/schemas/cookieRefreshToken.yaml
responses:
  '200':
    $ref: ../../components/responses/getAllContacts-200.yaml
  '400':
    $ref: ../../components/responses/getAllContacts-400.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
