tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description:
  '**Create** a new contact.Request contains **a body** as a **json** object
  with contact update data or **multipart/formdata** body that can contain
  avatar image.'
security:
  - bearerAuth: []
parameters:
  - $ref: ../../components/schemas/authHeader.yaml
  - $ref: ../../components/schemas/cookieSessionId.yaml
  - $ref: ../../components/schemas/cookieRefreshToken.yaml
requestBody:
  description: Provide data of the new contact .
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          $ref: ../../components/schemas/commonContactProperties.yaml
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          $ref: ../../components/schemas/commonContactProperties.yaml
          photo:
            description:
              "The file of the contact's avatar image uploaded to the cloud or
              server"
            type: string
            format: binary
            example: 'https://res.cloudinary.com/dbkdexyl9/image/upload/v1745741839/swbjzex5zv6lsncc4d3e.jpg'

responses:
  '201':
    $ref: ../../components/responses/createContact-201.yaml
  '400':
    $ref: ../../components/responses/createContact-400.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
