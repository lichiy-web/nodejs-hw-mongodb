description: Successfully found the contact by its id.
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example:
            'Successfully found a contact with id: 67f6381e907fe15ef69f1df0'
        data:
          type: object
          $ref: ../schemas/contactResponseForFormData.yaml
